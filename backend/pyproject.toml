[project]
name = "crip-backend"
version = "0.1.0"
description = "CRIP — Customer Retention Intelligence Platform (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "pandas>=3.0.5",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.6.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "category-encoders>=2.6.0",
    "joblib>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pandas-stubs>=3.0.3.260530",
    "scipy-stubs>=1.18.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Generated migrations import op/sa unconditionally (empty ones leave them unused) and are not
# hand-wrapped to the line-length limit.
"alembic/versions/*" = ["F401", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# None of these ship inline type hints or a complete stub package.
module = ["sklearn.*", "xgboost.*", "lightgbm.*", "category_encoders.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
