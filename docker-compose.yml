services:
  backend:
    build: ./backend
    environment:
      CRIP_DATABASE_URL: sqlite:////data/crip.db
      CRIP_CORS_ORIGINS: http://localhost:3000
      CRIP_UPLOAD_DIR: /data/uploads
      CRIP_SAMPLE_DATASET_PATH: /sample-data/telco.csv
    volumes:
      - backend-data:/data
      # Host data/ is gitignored and not in the build context; bind-mount it
      # read-only so "load sample dataset" can find the bundled reference CSV.
      - ./data:/sample-data:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-data:
